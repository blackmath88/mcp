<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCP Lab — Workbench</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="polish.css"><link rel="stylesheet" href="light.css"></head>
<body>
<header class="topbar"><strong><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 1v22M1 12h22M4 4l16 16M4 20 20 4"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg></span> MCP LAB</strong><span class="project">A field guide to connected AI</span><div class="top-actions"><button id="examples-toggle" aria-controls="explorer" aria-expanded="false">Examples</button><button id="inspector-toggle" aria-controls="inspector" aria-expanded="true">Inspector</button><button id="reset">Reset example</button></div></header>
<div class="shell">
<nav id="explorer" class="explorer" aria-label="Examples"><div class="panel-label">EXPLORER <span>08 exhibits</span></div><label class="search-label" for="search">Find a task, product or concept</label><input id="search" type="search" placeholder="Search examples…"><button id="weird" aria-pressed="false">◇ Weird only</button><div id="example-list"></div><p class="sidebar-note">Real-world references, ordered for learning—not ranked by popularity.</p></nav>
<main class="editor"><div id="tabs" class="tabs" role="tablist" aria-label="Example views"></div><div class="toolbar"><div><strong id="workspace-title"></strong><span id="mode" class="badge"></span></div><span id="hint"></span></div><div id="surface" class="surface" role="tabpanel" tabindex="-1"></div><section class="console" aria-label="Illustrative activity"><div class="console-head"><strong>ACTIVITY</strong><span id="event-count"></span></div><div id="timeline" aria-label="Run events"></div></section></main>
<aside id="inspector" class="inspector" aria-label="Contextual inspector"><div class="panel-label">INSPECTOR <span>Context & controls</span></div><div id="inspect"></div></aside></div>
<footer><span id="status" role="status">Ready</span><span>Interactive models & previews · no live account or AI</span></footer>
<noscript>This workbench needs JavaScript for its interactive models. Source-backed research is available in the repository’s docs/research folder.</noscript>
<script type="module" src="app.js"></script></body></html>
